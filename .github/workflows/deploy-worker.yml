name: Deploy CraftMate Connector Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare deployment secrets are not configured yet. Skipping Worker deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Cloudflare can list Workers scripts
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          status="$(curl --silent --show-error --output /tmp/cf-workers.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts")"
          echo "Cloudflare Workers scripts API status: ${status}"
          if [ "${status}" != "200" ]; then
            echo "::error title=Cloudflare Workers preflight failed::HTTP ${status} while listing Workers scripts for the configured account."
            exit 1
          fi

      - name: Deploy Worker with Wrangler
        if: steps.cf.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.43.0"
          workingDirectory: worker
          command: deploy

      - name: Verify Worker health
        if: steps.cf.outputs.configured == 'true'
        run: |
          for attempt in $(seq 1 12); do
            body="$(curl --fail --silent --show-error \
              https://craftmate-connector-api.craftmate-api-sayed.workers.dev/health)" || body=""
            echo "$body"
            if echo "$body" | grep -q '"version":"0.13.0"' \
              && echo "$body" | grep -q '"auth_registration":true' \
              && echo "$body" | grep -q '"configured":true' \
              && echo "$body" | grep -q '"gemini_configured":true'; then
              exit 0
            fi
            echo "Worker health is not fully propagated yet; retrying (${attempt}/12)..."
            sleep 5
          done
          echo "::error title=Worker health verification failed::The deployed Worker did not report version 0.13.0 with Gemini configured in time."
          exit 1
