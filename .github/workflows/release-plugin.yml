name: Release CraftMate Connector Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, for example v0.3.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-plugin:
    name: Build and publish plugin JAR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./plugin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build plugin JAR
        run: gradle clean jar --no-daemon

      - name: Create checksum
        working-directory: .
        run: |
          cd plugin/build/libs
          sha256sum CraftMate-Connector-*.jar > SHA256SUMS.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            plugin/build/libs/CraftMate-Connector-*.jar
            plugin/build/libs/SHA256SUMS.txt
