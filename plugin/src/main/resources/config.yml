# ============================================================================
# CraftMate Connector v0.6.1 — Configuration
# Dashboard: https://sayed1135.github.io/CraftMate-AI/app.html
# Docs: https://github.com/SAYED1135/CraftMate-AI
# ============================================================================

# Supported MVP Host Providers:
#   auto          -> Auto-detect based on RAM & proxy settings
#   play_hosting  -> play.hosting (3GB RAM, Extra UDP Ports supported)
#   falixnodes    -> falixnodes.net (Modrinth/Hangar marketplace, 5 Extra Ports)
#   mcserverhost  -> mcserverhost.com (4GB RAM, SFTP + File Manager)
#   minefort      -> minefort.com (1GB RAM, BungeeCord Proxy LOCKED to true)
host-provider: "auto"

backend:
  # CraftMate Connector API (Cloudflare Worker) base URL — NO trailing slash.
  # Production Worker for CraftMate AI. Do not put a Supabase URL or any key here.
  api-url: "https://craftmate-connector-api.craftmate-api-sayed.workers.dev"
  # Backwards-compatible fallback if api-url is removed:
  endpoint-url: ""
  project-ref: "fucsztovkkilyboinhrv"
  # Long-lived server token (automatically populated after `/craftmate link <CODE>`)
  # Never share this token. Revoke it anytime with `/craftmate disconnect`.
  connector-token: ""
  server-id: ""

# Reverse linking (plugin-generated code)
# Run /craftmate link in-game. The plugin generates a one-time code, you enter
# it in the dashboard, and the plugin keeps trying automatically for 30 min.
linking:
  pending-pairing-code: ""
  pending-pairing-expires-at: 0
  pending-pairing-created-at: ""
  auto-claim-interval-seconds: 10

# Polling & Resource Limits (FR-16 & NFR Performance)
polling:
  enabled: true
  heartbeat-interval-seconds: 60
  task-poll-interval-seconds: 15
  request-timeout-seconds: 10
  notify-hibernation-on-empty-shutdown: true

# Remote control tasks are accepted only while the server owner has an active
# full-control session enabled from the CraftMate website. The plugin still
# rejects unknown task types locally; this slice polls read-only tasks first.
control:
  task-polling-enabled: true
  # Live, reversible world tasks (difficulty/time/weather/default gamemode/
  # broadcast) received through the website full-control session. Set false
  # to disable them locally. File edits stay under security.read-only-mode.
  allow-live-write-tasks: true

# Security & Policy Guardrails
security:
  # Default: Read-only mode (diagnostics, log scrubbing, capability discovery only)
  read-only-mode: true
  create-backup-before-edit: true
  # Local scrubbing strips player IPs, RCON passwords and DB URIs before upload
  redact-ips-and-secrets: true
  max-log-lines-per-snapshot: 250
